name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy

      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --all --check

      # Warnings are failures here; the point of the gate is that they never accumulate.
      - run: cargo clippy --all-targets -- -D warnings

      - run: cargo test --all-targets

      # The sysfs and D-Bus paths cannot run on a CI box with no battery, so this only
      # proves it builds for release, not that it works.
      - run: cargo build --release
