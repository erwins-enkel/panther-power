name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy

      - uses: Swatinem/rust-cache@v2

      # Each gate is a separate step so a failure is obvious in the UI, but the commands
      # themselves live in the Makefile — `make ci` locally runs exactly this list.
      - run: make fmt-check

      - run: make lint

      - run: make test

      # The sysfs and D-Bus paths cannot run on a CI box with no battery, so this only
      # proves it builds for release, not that it works.
      - run: make build
