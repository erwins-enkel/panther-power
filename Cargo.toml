[package]
name = "panther-power"
version = "0.1.0"
edition = "2024"
# Floor set by ratatui 1.88 and by let-chains, which this crate uses. Verified in CI
# rather than asserted — see the `msrv` recipe.
rust-version = "1.88"
description = "Live terminal chart of laptop power draw, in braille"
license = "MIT"
repository = "https://github.com/erwins-enkel/panther-power"
keywords = ["tui", "battery", "power", "ratatui", "monitoring"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1.0.104"
catppuccin = { version = "2.8.0", features = ["ratatui"] }
clap = { version = "4.6.5", features = ["derive"] }
crossterm = "0.29.0"
ratatui = "0.30.2"
zbus = "5.18.0"
