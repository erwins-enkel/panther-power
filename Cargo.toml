[package]
name = "panther-power"
version = "0.1.0"
edition = "2024"
description = "Live terminal chart of laptop power draw, in braille"
license = "MIT"
repository = "https://github.com/erwins-enkel/panther-power"
keywords = ["tui", "battery", "power", "ratatui", "monitoring"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1.0.104"
catppuccin = { version = "2.8.0", features = ["ratatui"] }
crossterm = "0.29.0"
ratatui = "0.30.2"
zbus = "5.18.0"
